# Run config for promptset/scripts/generate.py (SynthID-Text study, English vs Hindi, Qwen3-14B).
#
# The model / watermark / generation / detection blocks have exactly the format of
# synthid/config/default.yaml and are parsed by synthid_wm.load_config's own validation.
# The extra `batching` block is read by generate.py only and is NOT written into the saved
# run config (<out>.config.yaml), so that file stays loadable by synthid_wm.load_config and by
# `python -m demo verify --config`.
#
# Generation and verification MUST use the same `watermark` block and the same tokenizer.

model:
  model_id: Qwen/Qwen3-14B     # HF id or a local directory. Every Qwen3 size shares one tokenizer, so cutoffs,
  #                              trimming and detection are the same for 8B and 14B (one model per dump).
  device: auto                 # auto = cuda > mps > cpu; one GPU per process (use CUDA_VISIBLE_DEVICES + --shard)
  dtype: bfloat16

watermark:
  # These are the PUBLIC demo keys from the Hugging Face SynthID-Text blog post. run_study.py replaces them with
  # the private keys in study.yaml keys.file (created on the first run). Running generate.py by hand: pass a
  # private copy of this file. Do not commit private keys: every dump's config/ holds them too.
  keys: [654, 400, 836, 123, 340, 443, 597, 160, 57, 29, 590, 639, 13, 715, 468, 990, 966, 226, 324, 585, 118, 504, 421, 521, 129, 669, 732, 225, 90, 960]
  ngram_len: 5                 # context of ngram_len-1 previous tokens seeds each g-value
  sampling_table_size: 65536
  sampling_table_seed: 0
  context_history_size: 1024
  skip_first_ngram_calls: false

generation:
  # Sampling is IDENTICAL across all levels (G, L1..L4, C, O, OX) and both languages.
  max_new_tokens: 2000         # fallback only: each prompt row's own max_new_tokens wins
  do_sample: true
  temperature: 0.7
  top_k: 40
  top_p: 1.0                   # 1.0 disables nucleus sampling (overrides Qwen3's generation_config default 0.95)
  use_chat_template: true      # rows carry chat `messages`; always applied
  enable_thinking: false       # Qwen3: no <think> block. Rows' chat_template_kwargs are merged over this.
  seed: 0                      # unused by generate.py (seeds are per row: generation.seed + attempt)

detection:
  method: weighted_mean
  alpha: 0.01
  min_scored: 50
  null_mean: table
  bayesian_detector: null

batching:
  batch_size: 32               # hard cap on rows per generate() call
  # Rows per batch are also limited by batch_size * (longest_prompt_tokens + max_new_tokens) <= token_budget.
  # The KV cache of Qwen3-14B in bf16 is 160 KiB per token (40 layers x 8 KV heads x 128 dims x 2 x 2 bytes),
  # so 110k tokens ~ 17 GB of KV cache on top of ~30 GB of weights: fits an 80 GB A100/H100 with headroom.
  # The SynthID processor also allocates several transient [batch, vocab=151936, depth=30] int64 tensors
  # per decoding step (~1.2 GB each at batch 32), so leave a few GB spare.
  # 14B needs an 80 GB card for useful batches (on 48 GB: about 30000). For Qwen3-8B, 160000 fits 80 GB.
  # On CUDA OOM a batch is halved and retried automatically.
  token_budget: 110000
